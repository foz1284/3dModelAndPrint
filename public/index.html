<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Model & Print</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI-assisted fabrication</p>
          <h1>3D Model & Print</h1>
        </div>
        <label class="toggle-wrap">
          <input id="approval-toggle" type="checkbox" checked />
          <span>Require approvals</span>
        </label>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>New print request</h2>
          <form id="job-form">
            <label for="prompt">Describe the object</label>
            <textarea id="prompt" rows="6" placeholder="Example: Make a custom wall-mounted phone stand with a cable channel and a rounded base."></textarea>
            <button type="submit">Submit request</button>
          </form>
        </section>

        <section class="panel jobs-panel">
          <h2>Workflow</h2>
          <div id="jobs"></div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
